syntax = "proto3";

package auth;

// This is the Go package name
option go_package = "authpb/";


message Account {
    string id = 1;
    string phone = 2;
    string email = 3;
}

// Auth service
service AuthService {
    rpc Login (LoginRequest) returns (LoginResponse);
    rpc LoginByPhone (LoginByPhoneRequest) returns (LoginResponse);
    rpc Register (RegisterRequest) returns (RegisterResponse);
    rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
    rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc CheckPhoneExists (CheckPhoneExistsRequest) returns (CheckPhoneExistsResponse);
    rpc GetAccountsByPhone (GetAccountsByPhoneRequest) returns (GetAccountsByPhoneResponse);
    rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
    rpc GetMyAccount (GetMyAccountRequest) returns (GetMyAccountResponse);
    // Social login
    rpc SocialLogin (SocialLoginRequest) returns (LoginResponse);
    // Admin login
    rpc AdminLogin (AdminLoginRequest) returns (AdminLoginResponse);

    // Change password (only requires user id and new password)
    rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
    rpc ChangePasswordByEmail (ChangePasswordByEmailRequest) returns (ChangePasswordResponse);

    // Admin account management
    rpc CreateAdminAccount (CreateAdminAccountRequest) returns (CreateAdminAccountResponse);
    rpc UpdateAdminAccount (UpdateAdminAccountRequest) returns (UpdateAdminAccountResponse);
    rpc UpdateAdminPassword (UpdateAdminPasswordRequest) returns (UpdateAdminPasswordResponse);
    rpc ListAdminAccounts (ListAdminAccountsRequest) returns (ListAdminAccountsResponse);
    rpc GetAdminAccount (GetAdminAccountRequest) returns (GetAdminAccountResponse);
}

// Login request and response
message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string ws_token = 2;
    string refresh_token = 3;
    int32 expires_in = 4;
}

// Login by Phone request
message LoginByPhoneRequest {
    string phone = 1;
}

// Register request and response
message RegisterRequest {
    string email = 1;
    string password = 2;
}

message RegisterResponse {
	bool success = 1;
}

message ChangePasswordRequest {
    string user_id = 1;
    string new_password = 2;
}

message ChangePasswordResponse {
    bool success = 1;
}

message ChangePasswordByEmailRequest {
    string email = 1;
    string new_password = 2;
}

// Refresh token request and response
message RefreshTokenRequest {
    string refresh_token = 1;
}

message RefreshTokenResponse {
    string access_token = 1;
    string ws_token = 2;
    int32 expires_in = 3;
}

// Validate token request and response
message ValidateTokenRequest {
    string access_token = 1;
}

message ValidateTokenResponse {
    bool is_valid = 1;
    string user_id = 2;
}

// Check phone exists request and response
message CheckPhoneExistsRequest {
    string phone = 1;
}

message CheckPhoneExistsResponse {
    bool exists = 1;
}

// Get user by phone numbers request and response
message GetAccountsByPhoneRequest {
    repeated string phone_numbers = 1;
}

message GetAccountsByPhoneResponse {
    repeated Account accounts = 1;
}

// Delete account request and response
message DeleteAccountRequest {
    string account_id = 1;
}

message DeleteAccountResponse {
    bool success = 1;
}

// Get my account request and response
message GetMyAccountRequest {
    string account_id = 1;
}

message GetMyAccountResponse {
    string id = 1;
    string phone = 2;
    string email = 3;
}

// Social login request supports multiple providers and multi-audience for OIDC
message SocialLoginRequest {
    // provider values: GOOGLE, APPLE, FACEBOOK
    string provider = 1;
    // ID token for OIDC (Google, Apple) or access token for Facebook
    string token = 2;
}

// Admin login request
message AdminLoginRequest {
    string username = 1;
    string password = 2;
}

// Admin status enum
enum AdminStatus {
    UNACTIVE = 0;
    ACTIVE = 1;
}

// Admin role enum
enum AdminRole {
    ADMIN_ROLE_UNSPECIFIED = 0;
    ADMIN = 1;
    SUPER_ADMIN = 999;
}

// Admin account info message
message AdminAccountInfo {
    string id = 1;
    string username = 2;
    string name = 3;
    string email = 4;
    string phone = 5;
    AdminRole role = 6;
    AdminStatus status = 7;
    string avatar_image_id = 8;
    string avatar_url = 9;
    string last_login_at = 10;
    string created_at = 11;
    string updated_at = 12;
}

// Admin login response (extended with admin info)
message AdminLoginResponse {
    string access_token = 1;
    string ws_token = 2;
    string refresh_token = 3;
    int32 expires_in = 4;
    AdminAccountInfo admin = 5;
}

// Create admin account request
message CreateAdminAccountRequest {
    string requester_id = 1;  // ID of admin making the request (for authorization)
    string username = 2;
    string password = 3;
    string name = 4;
    string email = 5;
    string phone = 6;
    AdminRole role = 7;
    string avatar_image_id = 8;
    string avatar_url = 9;
}

// Create admin account response
message CreateAdminAccountResponse {
    bool success = 1;
    AdminAccountInfo admin = 2;
}

// Update admin account request
message UpdateAdminAccountRequest {
    string requester_id = 1;  // ID of admin making the request (for authorization)
    string admin_id = 2;      // ID of admin to update
    string name = 3;
    string phone = 4;
    AdminRole role = 5;
    AdminStatus status = 6;
    string avatar_image_id = 7;
    string avatar_url = 8;
}

// Update admin account response
message UpdateAdminAccountResponse {
    bool success = 1;
    AdminAccountInfo admin = 2;
}

// Update admin password request
message UpdateAdminPasswordRequest {
    string requester_id = 1;  // ID of admin making the request
    string admin_id = 2;      // ID of admin whose password to update
    string new_password = 3;
}

// Update admin password response
message UpdateAdminPasswordResponse {
    bool success = 1;
}

// List admin accounts request
message ListAdminAccountsRequest {
    int32 page = 1;
    int32 limit = 2;
    AdminStatus status = 3;   // Optional filter by status
    AdminRole role = 4;       // Optional filter by role
}

// List admin accounts response
message ListAdminAccountsResponse {
    repeated AdminAccountInfo admins = 1;
    int32 total = 2;
    int32 page = 3;
    int32 limit = 4;
}

// Get admin account request
message GetAdminAccountRequest {
    string admin_id = 1;
}

// Get admin account response
message GetAdminAccountResponse {
    AdminAccountInfo admin = 1;
}