syntax = "proto3";

package post;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "postpb/";

service PostService {
  // Post operations
  rpc CreatePost (CreatePostReq) returns (CreatePostRes);
  rpc GetPost (GetPostReq) returns (GetPostRes);
  rpc GetPosts (GetPostsReq) returns (GetPostsRes);
  rpc UpdatePost (UpdatePostReq) returns (UpdatePostRes);
  rpc DeletePost (DeletePostReq) returns (google.protobuf.Empty);
  rpc SoftDeletePost (SoftDeletePostReq) returns (google.protobuf.Empty);
  rpc GetPostsByAccount (GetPostsByAccountReq) returns (GetPostsRes);
  rpc GetPostsByCategory (GetPostsByCategoryReq) returns (GetPostsRes);
  rpc GetPostsByHashtag (GetPostsByHashtagReq) returns (GetPostsRes);
  rpc SearchPosts (SearchPostsReq) returns (GetPostsRes);

  // Like operations
  rpc LikePost (LikePostReq) returns (google.protobuf.Empty);
  rpc UnlikePost (UnlikePostReq) returns (google.protobuf.Empty);
  rpc GetLikedPostsByAccount (GetLikedPostsByAccountReq) returns (GetPostsRes);
  rpc CheckLikePost (CheckLikePostReq) returns (CheckLikePostRes);
  rpc CheckLikePostByIds (CheckLikePostByIdsReq) returns (CheckLikePostByIdsRes);

  // Favorite operations
  rpc FavoritePost (FavoritePostReq) returns (google.protobuf.Empty);
  rpc UnfavoritePost (UnfavoritePostReq) returns (google.protobuf.Empty);
  rpc GetFavoritePostsByAccount (GetFavoritePostsByAccountReq) returns (GetPostsRes);
  rpc CheckFavoritePost (CheckFavoritePostReq) returns (CheckFavoritePostRes);
  rpc CheckFavoritePostByIds (CheckFavoritePostByIdsReq) returns (CheckFavoritePostByIdsRes);

  // Category operations
  rpc CreateCategory (CreateCategoryReq) returns (CreateCategoryRes);
  rpc GetCategory (GetCategoryReq) returns (GetCategoryRes);
  rpc GetCategories (GetCategoriesReq) returns (GetCategoriesRes);
  rpc UpdateCategory (UpdateCategoryReq) returns (UpdateCategoryRes);
  rpc DeleteCategory (DeleteCategoryReq) returns (google.protobuf.Empty);
  rpc SoftDeleteCategory (DeleteCategoryReq) returns (google.protobuf.Empty);
  rpc UpdateCategoryStatus (UpdateCategoryStatusReq) returns (google.protobuf.Empty);

  // Admin operations
  rpc AdminListPosts (AdminListPostsReq) returns (AdminListPostsRes);
  rpc AdminChangePostStatus (AdminChangePostStatusReq) returns (google.protobuf.Empty);
  rpc AdminGetReport (AdminGetReportReq) returns (AdminGetReportRes);
  rpc AdminListReports (AdminListReportsReq) returns (AdminListReportsRes);

  // Report operations
  rpc CreateReport (CreateReportReq) returns (CreateReportRes);
  rpc MarkReportReviewing (MarkReportReviewingReq) returns (google.protobuf.Empty);
  rpc ResolveReport (ResolveReportReq) returns (google.protobuf.Empty);
  rpc RejectReport (RejectReportReq) returns (google.protobuf.Empty);
  rpc GetReportsByReporter (GetReportsByReporterReq) returns (GetReportsByReporterRes);
  rpc GetReportsByReporterCursor (GetReportsByReporterCursorReq) returns (GetReportsByReporterCursorRes);

  // Stats operations
  rpc GetPublicPostsCountByAccount (GetPublicPostsCountByAccountReq) returns (GetPublicPostsCountByAccountRes);
  rpc GetLikedPostsCountByAccount (GetLikedPostsCountByAccountReq) returns (GetLikedPostsCountByAccountRes);

  // Comment operations
  rpc CreateComment (CreateCommentReq) returns (CreateCommentRes);
  rpc GetCommentsByPost (GetCommentsByPostReq) returns (GetCommentsByPostRes);
  rpc UpdateComment (UpdateCommentReq) returns (UpdateCommentRes);
  rpc DeleteComment (DeleteCommentReq) returns (google.protobuf.Empty);

  // Share Link operations
  rpc CreatePostShareLink (CreatePostShareLinkReq) returns (CreatePostShareLinkRes);
  rpc GetPostShareLink (GetPostShareLinkReq) returns (GetPostShareLinkRes);
  rpc GetPostShareLinksByPost (GetPostShareLinksByPostReq) returns (GetPostShareLinksByPostRes);

  // Elo review operations
  rpc ReviewEloPost (ReviewEloPostReq) returns (ReviewEloPostRes);
  rpc ReviewEloComment (ReviewEloCommentReq) returns (ReviewEloCommentRes);

  // Admin comment operations
  rpc AdminGetListComments (AdminGetListCommentsReq) returns (AdminGetListCommentsRes);
  rpc AdminDeleteComment (AdminDeleteCommentReq) returns (google.protobuf.Empty);
}

// Post Messages
message CreatePostReq {
  string          title       = 1;
  string          description = 2;
  repeated string hashtags    = 3;
  string          category_id = 4;
  Affiliate       affiliate   = 5;
  string          account_id  = 6;
  repeated string media_url   = 7;
  string          visibility  = 8; // draft, private, public
  string          persona_id  = 9; // Optional: persona ID for elo review
}

message CreatePostRes {
  bool   success = 1;
  string post_id = 2;
  string message = 3;
}

message GetPostReq {
  string post_id = 1;
}

message GetPostRes {
  Post post = 1;
}

message GetPostsReq {
  int32  limit   = 1;
  int32  offset  = 2;
  string sort_by = 3; // created_at, updated_at, popular
  string order   = 4; // asc, desc
}

message GetPostsRes {
  repeated Post posts  = 1;
  int32         total  = 2;
  int32         limit  = 3;
  int32         offset = 4;
}

message UpdatePostReq {
  string          post_id     = 1;
  string          account_id  = 2;
  string          title       = 3;
  string          description = 4;
  repeated string hashtags    = 5;
  string          category_id = 6;
  Affiliate       affiliate   = 7;
  repeated string media_url   = 8;
  string          visibility  = 9; // draft, private, public
}

message UpdatePostRes {
  bool   success = 1;
  string message = 2;
}

message DeletePostReq {
  string post_id    = 1;
  string account_id = 2;
}

message SoftDeletePostReq {
  string post_id    = 1;
  string account_id = 2;
  string reason     = 3;
}

message GetPostsByAccountReq {
  string account_id = 1;
  int32  limit      = 2;
  int32  offset     = 3;
}

message GetPostsByCategoryReq {
  string category_id = 1;
  int32  limit       = 2;
  int32  offset      = 3;
}

message GetPostsByHashtagReq {
  string hashtag = 1;
  int32  limit   = 2;
  int32  offset  = 3;
}

message SearchPostsReq {
  string          query       = 1;
  repeated string hashtags    = 2;
  string          category_id = 3;
  int32           limit       = 4;
  int32           offset      = 5;
}

// Category Messages
message CreateCategoryReq {
  string name        = 1;
  string description = 2;
  string parent_id   = 3; // For hierarchical categories
  string icon        = 4;
  int32  sort_order  = 5;
  string created_by  = 6;
}

message CreateCategoryRes {
  bool   success     = 1;
  string category_id = 2;
  string message     = 3;
}

message GetCategoryReq {
  string category_id = 1;
}

message GetCategoryRes {
  Category category = 1;
}

message GetCategoriesReq {
  string        parent_id = 1; // Empty for root categories
  int32         limit     = 2;
  int32         offset    = 3;
  optional bool is_active = 4; // Filter by active status
}

message GetCategoriesRes {
  repeated Category categories = 1;
  int32             total      = 2;
}

message UpdateCategoryReq {
  string category_id = 1;
  string name        = 2;
  string description = 3;
  string parent_id   = 4;
  string icon        = 5;
  int32  sort_order  = 6;
}

message UpdateCategoryRes {
  bool   success = 1;
  string message = 2;
}

message DeleteCategoryReq {
  string category_id = 1;
}

message UpdateCategoryStatusReq {
  string category_id = 1;
  bool   is_active   = 2;
}

// Data models
message Post {
  string                    id            = 1;
  string                    account_id    = 2;
  string                    title         = 3;
  string                    description   = 4;
  repeated string           hashtags      = 5;
  string                    category_id   = 6;
  Affiliate                 affiliate     = 7;
  google.protobuf.Timestamp created_at    = 8;
  google.protobuf.Timestamp updated_at    = 9;
  int32                     view_count    = 10;
  int32                     like_count    = 11;
  int32                     comment_count = 12;
  int32                     share_count   = 13;
  Category                  category      = 14; // Include category details
  repeated string           media_url     = 15; // Single video/file link
  string                    status        = 16; // pending, approved, restricted, banned, deleted
  string                    visibility    = 17; // draft, private, public
  google.protobuf.Timestamp deleted_at    = 18;
  string                    status_reason = 19;
  string                    persona_id    = 20;
  bool                      elo_reviewed  = 21;
}

message Category {
  string                    id          = 1;
  string                    name        = 2;
  string                    description = 3;
  string                    parent_id   = 4;
  string                    icon        = 5;
  int32                     sort_order  = 6;
  bool                      is_active   = 7;
  google.protobuf.Timestamp created_at  = 8;
  google.protobuf.Timestamp updated_at  = 9;
  int32                     post_count  = 10;
  string                    slug        = 11;
  string                    created_by  = 12;
  google.protobuf.Timestamp deleted_at  = 13;
}

message Affiliate {
  string link      = 1;
  string thumbnail = 2;
  string title     = 3;
}

message Report {
  string                    id             = 1;
  string                    target_type    = 2; // post, comment, user
  string                    target_id      = 3;
  string                    reason         = 4;
  string                    description    = 5;
  string                    reporter_id    = 6;
  string                    status         = 7; // pending, reviewing, resolved, rejected
  string                    resolve_report = 8; // remove_content, restrict_content, warning_user
  string                    note           = 9;
  google.protobuf.Timestamp created_at     = 10;
  google.protobuf.Timestamp updated_at     = 11;
  string                    resolved_by    = 12;
  google.protobuf.Timestamp resolved_at    = 13;
}

// Like Messages
message LikePostReq {
  string post_id    = 1;
  string account_id = 2;
}

message UnlikePostReq {
  string post_id    = 1;
  string account_id = 2;
}

message GetLikedPostsByAccountReq {
  string account_id = 1;
  int32  limit      = 2;
  int32  offset     = 3;
}

message CheckLikePostReq {
  string post_id    = 1;
  string account_id = 2;
}

message CheckLikePostRes {
  bool is_liked = 1;
}

message CheckLikePostByIdsReq {
  repeated string post_ids   = 1;
  string          account_id = 2;
}

message CheckLikePostByIdsRes {
  repeated string post_ids = 1; // List of post IDs that the account has liked
}

// Favorite Messages
message FavoritePostReq {
  string post_id    = 1;
  string account_id = 2;
}

message UnfavoritePostReq {
  string post_id    = 1;
  string account_id = 2;
}

message GetFavoritePostsByAccountReq {
  string account_id = 1;
  int32  limit      = 2;
  int32  offset     = 3;
}

message CheckFavoritePostReq {
  string post_id    = 1;
  string account_id = 2;
}

message CheckFavoritePostRes {
  bool is_favorited = 1;
}

message CheckFavoritePostByIdsReq {
  repeated string post_ids   = 1;
  string          account_id = 2;
}

message CheckFavoritePostByIdsRes {
  repeated string post_ids = 1; // List of post IDs that the account has favorited
}

// Report Messages
message CreateReportReq {
  string target_type = 1; // post, comment, user
  string target_id   = 2;
  string reason      = 3; // spam, sensitive, violence, scam, other
  string description = 4;
  string reporter_id = 5;
}

message CreateReportRes {
  bool   success = 1;
  string message = 2;
}

message MarkReportReviewingReq {
  string report_id = 1;
}

message ResolveReportReq {
  string report_id      = 1;
  string resolve_report = 2; // remove_content, restrict_content, warning_user
  string note           = 3;
  string resolved_by    = 4;
}

message RejectReportReq {
  string report_id   = 1;
  string note        = 2;
  string resolved_by = 3;
}

message GetReportsByReporterReq {
  string reporter_id = 1;
  int32  limit       = 2;
  int32  offset      = 3;
}

message GetReportsByReporterRes {
  repeated Report reports = 1;
  int32           total   = 2;
  int32           limit   = 3;
  int32           offset  = 4;
}

message GetReportsByReporterCursorReq {
  string reporter_id = 1;
  int32  page_size   = 2;
  string page_state  = 3;
}

message GetReportsByReporterCursorRes {
  repeated Report reports         = 1;
  string          next_page_state = 2;
}

// Admin Messages
message AdminGetReportReq {
  string report_id = 1;
}

message AdminGetReportRes {
  Report report = 1;
}

message AdminListReportsReq {
  string target_type = 1;
  string target_id   = 2;
  string reporter_id = 3;
  string status      = 4; // pending, reviewing, resolved, rejected
  int32  limit       = 5;
  int32  offset      = 6;
}

message AdminListReportsRes {
  repeated Report reports = 1;
  int32           total   = 2;
  int32           limit   = 3;
  int32           offset  = 4;
}

message AdminListPostsReq {
  string          category_id = 1;
  string          author_id   = 2;
  repeated string hashtags    = 3;
  string          status      = 4; // pending, approved, restricted, banned, deleted
  string          visibility  = 5; // draft, private, public
  string          search_text = 6;
  int32           limit       = 7;
  int32           offset      = 8;
  string          sort_by     = 9; // created_at, updated_at, like_count, etc.
  string          order       = 10; // asc, desc
}

message AdminListPostsRes {
  repeated Post posts  = 1;
  int32         total  = 2;
  int32         limit  = 3;
  int32         offset = 4;
}

message AdminChangePostStatusReq {
  string post_id = 1;
  string status  = 2; // pending, approved, restricted, banned, deleted
  string reason  = 3; // Reason for status change
}

// Stats Messages
message GetPublicPostsCountByAccountReq {
  string account_id = 1;
}

message GetPublicPostsCountByAccountRes {
  int32 count = 1;
}

message GetLikedPostsCountByAccountReq {
  string account_id = 1;
}

message GetLikedPostsCountByAccountRes {
  int32 count = 1;
}

// Comment Messages
message CreateCommentReq {
  string post_id    = 1;
  string account_id = 2;
  string comment    = 3; // Optional: text comment
  string photo_url  = 4; // Optional: photo URL
  string parent_id  = 5; // Optional: for replies to other comments
  string persona_id = 6; // Optional: persona ID for elo review
}

message CreateCommentRes {
  bool   success    = 1;
  string comment_id = 2;
  string message    = 3;
}

message GetCommentsByPostReq {
  string post_id   = 1;
  int32  limit     = 2;
  int32  offset    = 3;
  string parent_id = 4; // Optional: filter replies to a specific comment
}

message GetCommentsByPostRes {
  repeated Comment comments = 1;
  int32            total    = 2;
  int32            limit    = 3;
  int32            offset   = 4;
}

message UpdateCommentReq {
  string comment_id = 1;
  string account_id = 2;
  string comment    = 3; // Optional: updated text comment
  string photo_url  = 4; // Optional: updated photo URL
}

message UpdateCommentRes {
  bool   success = 1;
  string message = 2;
}

message DeleteCommentReq {
  string comment_id = 1;
  string account_id = 2;
}

// Comment data model
message Comment {
  string                    id           = 1;
  string                    post_id      = 2;
  string                    account_id   = 3;
  string                    parent_id    = 4; // Optional: for replies
  string                    comment      = 5; // Optional: text comment
  string                    photo_url    = 6; // Optional: photo URL
  google.protobuf.Timestamp created_at   = 7;
  google.protobuf.Timestamp updated_at   = 8;
  google.protobuf.Timestamp deleted_at   = 9; // Optional: for soft delete
  int32                     reply_count  = 10; // Number of direct child comments
  string                    persona_id   = 11; // Optional: persona ID for elo review
  bool                      elo_reviewed = 12; // Whether this comment has been elo-reviewed
}

// Share Link Messages
message CreatePostShareLinkReq {
  string post_id    = 1;
  string account_id = 2;
}

message CreatePostShareLinkRes {
  PostShareLink share_link = 1;
  string        short_url  = 2; // Full URL with short code
}

message GetPostShareLinkReq {
  string short_code = 1;
}

message GetPostShareLinkRes {
  PostShareLink share_link = 1;
  Post          post       = 2; // Include post details
}

message GetPostShareLinksByPostReq {
  string post_id = 1;
  int32  limit   = 2;
  int32  offset  = 3;
}

message GetPostShareLinksByPostRes {
  repeated PostShareLink share_links = 1;
  int32                  total       = 2;
  int32                  limit       = 3;
  int32                  offset      = 4;
}

// Share Link data model
message PostShareLink {
  string                    id         = 1;
  string                    post_id    = 2;
  string                    short_code = 3;
  string                    account_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int32                     view_count = 7;
  bool                      is_active  = 8;
}

// Elo Review Messages
message ReviewEloPostReq {
  string post_id = 1;
}

message ReviewEloPostRes {
  bool   success = 1;
  string message = 2;
}

// Elo Review Comment Messages
message ReviewEloCommentReq {
  string comment_id = 1;
}

message ReviewEloCommentRes {
  bool   success = 1;
  string message = 2;
}

// Admin Comment Messages
message AdminGetListCommentsReq {
  int32  limit      = 1;
  int32  offset     = 2;
  string post_id    = 3;
  string account_id = 4;
}

message AdminGetListCommentsRes {
  repeated Comment comments = 1;
  int32            total    = 2;
  int32            limit    = 3;
  int32            offset   = 4;
}

message AdminDeleteCommentReq {
  string comment_id = 1;
}
