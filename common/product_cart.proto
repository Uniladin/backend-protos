syntax = "proto3";

package productcartpb;
option go_package = "productcartpb/";

service ProductCartService {
  rpc CreateProductCart(CreateProductCartRequest) returns (CreateProductCartResponse) {}
  rpc AddProductCartImage(AddProductCartImageRequest) returns (AddProductCartImageResponse) {}
  rpc GetProductCartsByPostId(GetProductCartsByPostIdRequest) returns (GetProductCartsByPostIdResponse) {}
  rpc GetProductCartsByUserId(GetProductCartsByUserIdRequest) returns (GetProductCartsByUserIdResponse) {}
  rpc UpdateProductCart(UpdateProductCartRequest) returns (UpdateProductCartResponse) {}
  rpc DeleteProductCart(DeleteProductCartRequest) returns (DeleteProductCartResponse) {}
  rpc LinkProductCartsToPost(LinkProductCartsToPostRequest) returns (LinkProductCartsToPostResponse) {}
  rpc UpdateLinkProductCartsToPost(UpdateLinkProductCartsToPostRequest) returns (UpdateLinkProductCartsToPostResponse) {}
}

// Product Cart Messages
message ProductCartData {
  string id = 1;
  // repeated string post_ids = 2;
  string user_id = 3;
  string name = 4;
  string link = 5;
  string price = 6;
  string sale_price = 7;
  string status = 8;
  string created_at = 9;
  string updated_at = 10;
  repeated ProductCartImageData images = 11;
}

message ProductCartImageData {
  string id = 1;
  string product_cart_id = 2;
  string image_id = 3;
  string image_url = 4;
  int32 position = 5;
  string status = 6;
  string created_at = 7;
}

// Input message for creating product cart images
message ProductCartImageInput {
  string image_id = 1;
  string image_url = 2;
  int32 position = 3;
}

// Create Product Cart
message CreateProductCartRequest {
  repeated string post_ids = 1;
  string user_id = 2;
  string name = 3;
  string link = 4;
  string price = 5;
  string sale_price = 6;
  repeated ProductCartImageInput images = 7;
}

message CreateProductCartResponse {
  bool success = 1;
  ProductCartData product_cart = 2;
}

// Add Product Cart Image
message AddProductCartImageRequest {
  string product_cart_id = 1;
  string image_id = 2;
  string image_url = 3;
  int32 position = 4;
}

message AddProductCartImageResponse {
  bool success = 1;
  ProductCartImageData image = 2;
}

// Get Product Carts By Post ID
message GetProductCartsByPostIdRequest {
  string post_id = 1;
}

message GetProductCartsByPostIdResponse {
  repeated ProductCartData product_carts = 1;
}

// Get Product Carts By User ID
message GetProductCartsByUserIdRequest {
  string user_id = 1;
}

message GetProductCartsByUserIdResponse {
  repeated ProductCartData product_carts = 1;
}

// Update Product Cart
message UpdateProductCartRequest {
  string id = 1;
  string name = 2;
  string link = 3;
  string price = 4;
  string sale_price = 5;
  repeated ProductCartImageInput images = 6;
  repeated string post_ids = 7;
}

message UpdateProductCartResponse {
  bool success = 1;
  ProductCartData product_cart = 2;
}

// Delete Product Cart
message DeleteProductCartRequest {
  string id = 1;
}

message DeleteProductCartResponse {
  bool success = 1;
}

// Link Product Carts to Post
message LinkProductCartsToPostRequest {
  string post_id = 1;
  repeated string product_cart_ids = 2;
}

message LinkProductCartsToPostResponse {
  bool success = 1;
  string message = 2;
}

// Update Link Product Carts to Post
message UpdateLinkProductCartsToPostRequest {
  string post_id = 1;
  repeated string product_cart_ids = 2;
}

message UpdateLinkProductCartsToPostResponse {
  bool success = 1;
  string message = 2;
}
